<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
  <title>Community Corner</title>
</head>
<body>
  <div class="container">

    <h1>Community Corner</h1>

    <div class="box">
      <h2>Share Your Stargazing Story</h2>
      <form id="storyForm">
        <label>Your Name:</label><br>
        <input type="text" id="name"><br><br>

        <label>Your Stargazing Experience:</label><br>
        <textarea id="story" rows="4"></textarea><br><br>

        <button type="submit">Submit Story</button>
      </form>
    </div>

    <div class="box">
      <h2>Upload a Photo</h2>
      <input type="file" id="photoUpload"><br><br>
      <button id="uploadBtn">Upload Photo</button>
      <div id="photos"></div>
    </div>

    <button onclick="window.location.href='index.html'">Back to Homepage</button>

  </div>

  <footer>
    <p>✨ Starlight Beginners — Community Corner ✨</p>
  </footer>

 <!-- Firebase SDKs (v8 compatible) -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<!-- Your script -->
<script src="../script/script.js"></script>
</body>
</html>
